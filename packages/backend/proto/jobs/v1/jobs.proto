syntax = "proto3";

package jobs.v1;

// ============ Enums ============

enum AspectRatio {
  ASPECT_RATIO_UNSPECIFIED = 0;
  ASPECT_RATIO_16_9 = 1;
  ASPECT_RATIO_4_3 = 2;
  ASPECT_RATIO_1_1 = 3;
}

enum Cadence {
  CADENCE_UNSPECIFIED = 0;
  CADENCE_DAILY = 1;
  CADENCE_WEEKLY = 2;
  CADENCE_MONTHLY = 3;
}

enum JobFunction {
  JOB_FUNCTION_UNSPECIFIED = 0;
  JOB_FUNCTION_EDIT_VIDEO = 1;
  JOB_FUNCTION_AGENT_VIDEO = 2;
}

enum JobState {
  JOB_STATE_UNSPECIFIED = 0;
  JOB_STATE_PENDING = 1;
  JOB_STATE_IN_PROGRESS = 2;
  JOB_STATE_SUCCEEDED = 3;
  JOB_STATE_FAILED = 4;
}

// ============ Shared Metadata ============

message JobEnvelope {
  JobFunction fn = 1;
  string workspace_id = 2;
  optional string client_job_id = 3;
}

message JobMetadata {
  string call_id = 1;
  JobFunction fn = 2;
  string workspace_id = 3;
  int64 created_at_epoch_ms = 4;
  int64 updated_at_epoch_ms = 5;
}

// ============ Job Submission ============

message EditVideoJobRequest {
  JobEnvelope envelope = 1;
  string input_url = 2;
  AspectRatio aspect_ratio = 3;
  Cadence cadence = 4;
  bool wait_for_completion = 5;
}

message AgentVideoJobRequest {
  JobEnvelope envelope = 1;
  string product = 2;
  repeated string product_imgs = 3;
  repeated string avatar_imgs = 4;
  string business = 5;
  string user_message = 6;
  int32 max_turns = 7;
  bool wait_for_completion = 8;
}

message JobSubmitResponse {
  string call_id = 1;
}

// ============ Job Result ============

message JobResultRequest {
  string call_id = 1;
}

message EditVideoJobPayload {
  string output_url = 1;
  optional float progress = 2;
  optional string progress_message = 3;
}

message AgentVideoJobPayload {
  string video_url = 1;
  string summary = 2;
  optional float progress = 3;
  optional string progress_message = 4;
}

message JobResultResponse {
  JobMetadata metadata = 1;
  JobState state = 2;
  optional string error_code = 3;
  optional string error_message = 4;
  oneof payload {
    EditVideoJobPayload edit_video = 5;
    AgentVideoJobPayload agent_video = 6;
  }
}

// ============ Jobs service ============

service JobsService {
  // Submit an edit video job (async)
  rpc SubmitEditVideoJob(EditVideoJobRequest) returns (JobSubmitResponse) {}

  // Submit an agent video job (async)
  rpc SubmitAgentVideoJob(AgentVideoJobRequest) returns (JobSubmitResponse) {}

  // Get the result of a submitted job
  rpc GetJobResult(JobResultRequest) returns (JobResultResponse) {}
}
