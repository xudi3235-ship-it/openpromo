syntax = "proto3";

package jobs.v1;

// ============ Enums ============

enum AspectRatio {
  ASPECT_RATIO_UNSPECIFIED = 0;
  ASPECT_RATIO_16_9 = 1;
  ASPECT_RATIO_4_3 = 2;
  ASPECT_RATIO_1_1 = 3;
}

enum Cadence {
  CADENCE_UNSPECIFIED = 0;
  CADENCE_DAILY = 1;
  CADENCE_WEEKLY = 2;
  CADENCE_MONTHLY = 3;
}

enum JobStatus {
  JOB_STATUS_UNSPECIFIED = 0;
  JOB_STATUS_PENDING = 1;
  JOB_STATUS_SUCCEEDED = 2;
  JOB_STATUS_FAILED = 3;
}

enum JobFunction {
  JOB_FUNCTION_UNSPECIFIED = 0;
  JOB_FUNCTION_EDIT_VIDEO = 1;
  JOB_FUNCTION_AGENT_VIDEO = 2;
}

enum VideoGenStatus {
  VIDEO_GEN_STATUS_UNSPECIFIED = 0;
  VIDEO_GEN_STATUS_SUCCESS = 1;
  VIDEO_GEN_STATUS_FAILED = 2;
  VIDEO_GEN_STATUS_IN_PROGRESS = 3;
}

enum AgentOutputStatus {
  AGENT_OUTPUT_STATUS_UNSPECIFIED = 0;
  AGENT_OUTPUT_STATUS_SUCCESS = 1;
  AGENT_OUTPUT_STATUS_ERROR = 2;
}

// ============ Job Submission ============

// Request to submit an edit video job
message EditVideoJobRequest {
  string input_url = 1;
  AspectRatio aspect_ratio = 2;
  Cadence cadence = 3;
}

// Request to submit an agent video generation job
message AgentVideoJobRequest {
  string product = 1;
  repeated string product_imgs = 2;
  repeated string avatar_imgs = 3;
  string business = 4;
  string user_message = 5;
  int32 max_turns = 6;
  // For realtime progress updates via WebSocket
  string workspace_id = 7;
}

// Response after submitting a job
message JobSubmitResponse {
  string call_id = 1;
}

// ============ Job Result ============

// Request to get a job result
message JobResultRequest {
  string call_id = 1;
}

// Video edit result
message VideoEditResult {
  string output_url = 1;
}

// Agent video generation output
message AgentVideoGenSuccessOut {
  string video_url = 1;
  string summary = 2;
}

message AgentVideoGenErrorOut {
  string error_message = 1;
  string error_type = 2;
}

message AgentVideoGenOutput {
  AgentOutputStatus status = 1;
  oneof data {
    AgentVideoGenSuccessOut success = 2;
    AgentVideoGenErrorOut error = 3;
  }
}

// Video generation result variants
message VideoGenFailResult {
  string error = 1;
}

message VideoGenInProgressResult {
  float progress = 1;
  string message = 2;
}

message VideoGenSuccessResult {
  AgentVideoGenOutput out = 1;
}

// Response for job result
message JobResultResponse {
  JobFunction fn = 1;
  JobStatus status = 2;
  optional string error = 3;
  oneof result {
    VideoEditResult edit_result = 4;
    VideoGenSuccessResult video_gen_result = 5;
  }
}

// ============ Synchronous Video Generation ============

// Request for synchronous video generation
message VideoGenerateRequest {
  string product = 1;
  repeated string product_imgs = 2;
  repeated string avatar_imgs = 3;
  string business = 4;
  string user_message = 5;
  int32 max_turns = 6;
}

// Response for synchronous video generation
message VideoGenerateResponse {
  VideoGenStatus status = 1;
  oneof data {
    VideoGenSuccessResult success = 2;
    VideoGenFailResult fail = 3;
    VideoGenInProgressResult in_progress = 4;
  }
}

// Jobs service for managing async and sync video generation jobs
service JobsService {
  // Submit an edit video job (async)
  rpc SubmitEditVideoJob(EditVideoJobRequest) returns (JobSubmitResponse) {}
  
  // Submit an agent video job (async)
  rpc SubmitAgentVideoJob(AgentVideoJobRequest) returns (JobSubmitResponse) {}
  
  // Get the result of a submitted job
  rpc GetJobResult(JobResultRequest) returns (JobResultResponse) {}
  
  // Generate a video synchronously
  rpc GenerateVideo(VideoGenerateRequest) returns (VideoGenerateResponse) {}
}
