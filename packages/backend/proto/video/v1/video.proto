syntax = "proto3";

package video.v1;

// Request to transcode a video for a specific platform
message TranscodeRequest {
  // URL of the input video
  string input_url = 1;
  // Target platform: "ig_reel" or "fb_reel"
  string platform = 2;
}

// Response from video transcoding
message TranscodeResponse {
  // URL of the transcoded video (or original if no transcoding needed)
  string output_url = 1;
  // Whether the video was actually transcoded
  bool transcoded = 2;
  // Error message if any
  optional string error = 3;
}

// Request to run ffmpeg with placeholders for inputs/outputs
message RunFfmpegRequest {
  repeated string input_urls = 1;
  repeated string command = 2;
  string output_filename = 3;
}

message RunFfmpegResponse {
  string output_url = 1;
  bool success = 2;
  string error = 3;
}

// Video service for transcoding and processing videos
service VideoService {
  // Transcode a video for a specific platform (Instagram Reels, Facebook Reels)
  rpc Transcode(TranscodeRequest) returns (TranscodeResponse) {}

  // Execute an ffmpeg command on the server. Inputs are downloaded from
  // `input_urls` and made available as `{in0}`, `{in1}`, ... placeholders
  // in the `command` tokens. The `{out}` placeholder is replaced with the
  // server-side output path. The server uploads the resulting artifact to
  // R2 and returns a presigned `output_url`.
  rpc RunFfmpeg(RunFfmpegRequest) returns (RunFfmpegResponse) {}
}
