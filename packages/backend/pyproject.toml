[project]
name = "backend"
version = "0.1.0"
description = "python backend for openpromo"
readme = "README.md"
requires-python = "==3.12.9"
dependencies = [
    "boto3>=1.40.70",
    "fastapi[standard]>=0.116.2",
    "google-genai>=1.49.0",
    "modal>=1.2.2",
    "openai>=2.7.2",
    "replicate>=1.0.7",
    "requests>=2.32.5",
    "scalar-fastapi>=1.4.2",
]

[dependency-groups]
dev = [
    "basedpyright>=1.32.1",
    "jupyterlab>=4.4.10",
    "ruff>=0.13.1",
]

[tool.basedpyright]
include = ["src"]
exclude = ["**/node_modules",
    "**/__pycache__",
    "src/experimental",
    "src/typestubs"
]
ignore = ["src/oldstuff"]
defineConstant = { DEBUG = true }

reportMissingImports = "error"
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportPrivateImportUsage = false
reportUnusedCallResult= false

pythonVersion = "3.12.9"
pythonPlatform = "Linux"

executionEnvironments = [
]
