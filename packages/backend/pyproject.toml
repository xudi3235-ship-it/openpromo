[project]
name = "backend"
version = "0.1.0"
description = "python backend for openpromo"
readme = "README.md"
requires-python = "==3.12.9"
dependencies = [
    "boto3==1.40.74",
    "fastapi[standard]==0.121.2",
    "google-adk==1.18.0",
    "google-genai==1.50.1",
    "modal>=1.2.2",
    "openai==2.8.0",
    "openai-agents>=0.5.1",
    "pillow>=12.0.0",
    "replicate==1.0.7",
    "requests==2.32.5",
    "scalar-fastapi>=1.4.2",
    "scenedetect[opencv]>=0.6.7.1",
]

[dependency-groups]
dev = [
    "basedpyright>=1.33.0",
    "jupyterlab>=4.4.10",
    "ruff>=0.14.5",
]

[tool.basedpyright]
include = ["src"]
exclude = ["**/node_modules",
    "**/__pycache__",
    "src/experimental",
    "src/typestubs"
]
ignore = ["src/oldstuff"]
defineConstant = { DEBUG = true }

reportMissingImports = "error"
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportPrivateImportUsage = false
reportUnusedCallResult= false
reportExplicitAny = false

pythonVersion = "3.12.9"
pythonPlatform = "Linux"

executionEnvironments = [
]
