[project]
name = "backend"
version = "0.1.0"
description = "python backend for openpromo"
readme = "README.md"
requires-python = "==3.12.9"
dependencies = [
    "attrs>=25.4.0",
    "boto3==1.41.2",
    "fastapi[standard]==0.121.3",
    "google-genai==1.52.0",
    "httpx>=0.28.1",
    "modal>=1.2.4",
    "openai==2.8.1",
    "openai-agents[litellm]>=0.6.1",
    "pillow>=12.0.0",
    "replicate==1.0.7",
    "requests==2.32.5",
    "scalar-fastapi>=1.4.4",
    "scenedetect[opencv]>=0.6.7.1",
]

[dependency-groups]
dev = [
    "basedpyright>=1.34.0",
    "jupyterlab>=4.4.10",
    "openapi-python-client>=0.27.1",
    "ruff>=0.14.6",
]

[tool.basedpyright]
include = ["src"]
exclude = ["**/node_modules",
    "**/__pycache__",
    "src/experimental",
    "src/typestubs"
]
ignore = ["src/oldstuff"]
defineConstant = { DEBUG = true }

reportMissingImports = "error"
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportPrivateImportUsage = false
reportUnusedCallResult= false
reportExplicitAny = false
reportOptionalSubscript = false
reportOptionalMemberAccess = false

pythonVersion = "3.12.9"
pythonPlatform = "Linux"

executionEnvironments = [
]
