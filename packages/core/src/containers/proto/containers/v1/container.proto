syntax = "proto3";

package containers.v1;

option go_package = "main/gen/containers/v1;containersv1";

enum Platform {
  PLATFORM_UNSPECIFIED = 0;
  PLATFORM_IG_REEL = 1;
  PLATFORM_FB_REEL = 2;
  PLATFORM_TIKTOK = 3;
}

// Target R2 bucket for uploads
enum R2Bucket {
  R2_BUCKET_UNSPECIFIED = 0;  // Default: openpromo-bucket
  R2_BUCKET_DEFAULT = 1;       // openpromo-bucket
  R2_BUCKET_REFERENCE = 2;     // openpromo-reference
  R2_BUCKET_PUBLIC = 3;        // public bucket
}

// ContainerService exposes RPCs from the Worker to the container runtime.
service ContainerService {
  // Simple health check.
  rpc Ping(PingRequest) returns (PingResponse);

  // Resize a video and return the processed bytes.
  rpc ResizeVideo(ResizeVideoRequest) returns (ResizeVideoResponse);

  // Run an arbitrary ffmpeg command against downloaded inputs, upload output to R2, and return a presigned URL.
  rpc RunFfmpeg(RunFfmpegRequest) returns (RunFfmpegResponse);

  // Probe media metadata (duration, dimensions) using ffprobe.
  rpc ProbeMedia(ProbeMediaRequest) returns (ProbeMediaResponse);

  // Transcode video for social media platforms (IG Reel, FB Reel, etc.).
  rpc TranscodeVideo(TranscodeVideoRequest) returns (TranscodeVideoResponse);

  // Burn ASS subtitles into a video.
  rpc BurnSubtitle(BurnSubtitleRequest) returns (BurnSubtitleResponse);

  // Extract one or more frames from a video as JPEG images.
  rpc ExtractFrames(ExtractFramesRequest) returns (ExtractFramesResponse);
}

message PingRequest {}

message PingResponse {
  string message = 1;
  string instance_id = 2;
}

message ResizeVideoRequest {
  string video_url = 1;
  int32 width = 2;
  int32 height = 3;
}

message ResizeVideoResponse {
  string content_type = 1;
  string filename = 2;
  string r2_url = 3;
  string r2_key = 4;
}

message RunFfmpegRequest {
  repeated string input_urls = 1;
  // ffmpeg argv tokens; placeholders {in0}, {in1}, ... map to input files; {out} is replaced with the output path.
  repeated string command = 2;
  string output_filename = 3;
}

message RunFfmpegResponse {
  string r2_url = 1;
  string r2_key = 2;
  string content_type = 3;
  string filename = 4;
}

message ProbeMediaRequest {
  string url = 1;
}

message ProbeMediaResponse {
  // Duration in milliseconds, if available.
  uint64 duration_ms = 1;
  // First video stream width/height if present.
  uint32 width = 2;
  uint32 height = 3;
  string format = 4;
}

message TranscodeVideoRequest {
  string input_url = 1;
  Platform platform = 2;
}

message TranscodeVideoResponse {
  string output_url = 1;
  bool transcoded = 2;
  optional string error = 3;
}

message BurnSubtitleRequest {
  string video_url = 1;
  // Pre-generated ASS subtitle file content.
  string ass_content = 2;
}

message BurnSubtitleResponse {
  string output_url = 1;
  string r2_key = 2;
}

message ExtractFramesRequest {
  string video_url = 1;

  // Timestamps to extract (in seconds). If empty, extracts at 0.5s
  repeated float timestamps = 2;

  // Alternative: extract N frames evenly distributed across video duration
  // If set, overrides timestamps field
  optional uint32 frame_count = 3;

  // Output path prefix in R2 (e.g., "videos/abc123/")
  // Frame files will be named: {prefix}frame_0.jpg, {prefix}frame_1.jpg, etc.
  string output_prefix = 4;

  // Custom filename for single frame extraction (default: "frame_0.jpg")
  optional string output_filename = 5;

  // Target bucket
  R2Bucket bucket = 6;

  // JPEG quality (1-31, lower is better, default: 2)
  optional uint32 quality = 7;
}

message ExtractedFrame {
  float timestamp = 1;
  string r2_url = 2;
  string r2_key = 3;
  uint32 width = 4;
  uint32 height = 5;
}

message ExtractFramesResponse {
  repeated ExtractedFrame frames = 1;
  string content_type = 2;
}
