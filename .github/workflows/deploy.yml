name: Deployment

on:
  push:
    branches:
      - staging
      - production

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  deploy:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    environment:
      name: ${{ github.ref_name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v3

      - name: Wait for biome check
        uses: fountainhead/action-wait-for-check@v1.2.0
        id: biome-check
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          checkName: biome-check

      - name: Wait for typecheck
        uses: fountainhead/action-wait-for-check@v1.2.0
        id: typecheck
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          checkName: typecheck

      - name: Exit if code quality checks failed
        if: steps.biome-check.outputs.conclusion != 'success' || steps.typecheck.outputs.conclusion != 'success'
        run: |
          echo "Code quality checks failed"
          exit 1

      - name: Sync secrets to worker
        working-directory: packages/dash
        run: doppler secrets --config=${{ github.ref_name }} --json | jq -c 'with_entries(.value = .value.computed)' | pnpm exec wrangler secret bulk -e ${{ github.ref_name }}
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Deploy WWW
        working-directory: packages/www
        run: pnpm deploy:${{ github.ref_name }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VITE_DASHBOARD_URL: ${{ secrets.VITE_DASHBOARD_URL }}

      - name: Deploy Dashboard
        working-directory: packages/dash
        run: pnpm deploy:${{ github.ref_name }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Database migrations
        id: db-migrate
        working-directory: packages/core
        run: pnpm db:migrate
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
      
      - name: Sync UV dependencies
        working-directory: packages/backend
        run: uv sync --frozen
      - name: Deploy Modal Infra 
        working-directory: packages/backend
        run: |
          uv run modal deploy main.py
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}

      - name: Send success notification to Discord
        uses: appleboy/discord-action@v1.2.0
        with:
          webhook_url: ${{ secrets.DISCORD_DEPLOYMENT_WEBHOOK_URL }}
          message: |
            **[Success] Openpromo Deployed**
            - **Branch:** `${{ github.ref_name }}`
            - **Commit:** [${{ github.event.head_commit.message }}](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}) (`${{ github.sha }}`)

      - name: Send failure notification to Discord
        if: failure()
        uses: appleboy/discord-action@v1.2.0
        with:
          webhook_url: ${{ secrets.DISCORD_DEPLOYMENT_WEBHOOK_URL }}
          message: |
            **[Failed] Openpromo ${{steps.db-migrate.conclusion == 'failure' && 'Database Migration' || 'Deployment'}} Failed** ❌
            - **Branch:** `${{ github.ref_name }}`
            - **Commit:** [${{ github.event.head_commit.message }}](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}) (`${{ github.sha }}`)
            - **Job:** [${{ github.job }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            - **Error:** Check the workflow logs for details
