name: Deployment

on:
  push:
    branches:
      - staging
      - production

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  deploy:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    environment:
      name: ${{ github.ref_name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Setup Biome
        uses: biomejs/setup-biome@v2

      - name: Biome check
        run: biome ci --diagnostic-level=warn

      - name: Typecheck
        run: pnpm run typecheck

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v3

      - name: Install PostHog CLI
        run: npm install -g @posthog/cli

      - name: Setup Cloudflare Infrastructure
        uses: ./.github/actions/setup-cloudflare-infra
        with:
          cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Sync secrets to worker
        working-directory: packages/dash
        run: doppler secrets --config=${{ github.ref_name }} --json | jq -c 'with_entries(.value = .value.computed)' | pnpm exec wrangler secret bulk -e ${{ github.ref_name }}
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Deploy WWW
        working-directory: packages/www
        run: pnpm deploy:${{ github.ref_name }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VITE_DASHBOARD_URL: ${{ secrets.VITE_DASHBOARD_URL }}

      - name: Deploy Dashboard
        working-directory: packages/dash
        run: pnpm deploy:${{ github.ref_name }}
        env:
          VITE_PUBLIC_POSTHOG_KEY: ${{ secrets.VITE_PUBLIC_POSTHOG_KEY }}
          VITE_PUBLIC_POSTHOG_HOST: ${{ secrets.VITE_PUBLIC_POSTHOG_HOST }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          POSTHOG_CLI_TOKEN: ${{ secrets.POSTHOG_CLI_TOKEN }}
          POSTHOG_CLI_ENV_ID: ${{ secrets.POSTHOG_CLI_ENV_ID }}

      - name: Database migrations
        id: db-migrate
        working-directory: packages/core
        run: pnpm db:migrate
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
      
      - name: Sync UV dependencies
        working-directory: packages/backend
        run: uv sync --frozen
      - name: Sync Modal secrets
        working-directory: packages/backend
        run: |
          tmpfile=$(mktemp)
          doppler secrets --config=${{ github.ref_name }} --json | jq 'with_entries(.value = .value.computed)' > "$tmpfile"
          uv run modal secret create --force --from-json "$tmpfile" openpromo-secrets
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          # MODAL_ENVIRONMENT: ${{ github.ref_name }}
      - name: Deploy Modal Infra 
        working-directory: packages/backend
        run: |
          uv run modal deploy main.py
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}

      - name: Send success notification to Discord
        uses: appleboy/discord-action@v1.2.0
        with:
          webhook_url: ${{ secrets.DISCORD_DEPLOYMENT_WEBHOOK_URL }}
          message: |
            **[Success] Openpromo Deployed**
            - **Branch:** `${{ github.ref_name }}`
            - **Commit:** [${{ github.event.head_commit.message }}](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}) (`${{ github.sha }}`)

      - name: Send failure notification to Discord
        if: failure()
        uses: appleboy/discord-action@v1.2.0
        with:
          webhook_url: ${{ secrets.DISCORD_DEPLOYMENT_WEBHOOK_URL }}
          message: |
            **[Failed] Openpromo ${{steps.db-migrate.conclusion == 'failure' && 'Database Migration' || 'Deployment'}} Failed** ❌
            - **Branch:** `${{ github.ref_name }}`
            - **Commit:** [${{ github.event.head_commit.message }}](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}) (`${{ github.sha }}`)
            - **Job:** [${{ github.job }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            - **Error:** Check the workflow logs for details
