name: "Setup Cloudflare Infrastructure"
description: "Configure R2 bucket lifecycles"

inputs:
  cloudflare_account_id:
    description: "Cloudflare Account ID"
    required: true
  cloudflare_api_token:
    description: "Cloudflare API Token"
    required: true

runs:
  using: "composite"
  steps:
    - name: Configure R2 openpromo bucket lifecycle
      working-directory: packages/dash
      shell: bash
      run: pnpm exec wrangler r2 bucket lifecycle set openpromo-bucket --file ../../infra/r2/openpromo-bucket-lifecycle.json --force
      env:
        CLOUDFLARE_ACCOUNT_ID: ${{ inputs.cloudflare_account_id }}
        CLOUDFLARE_API_TOKEN: ${{ inputs.cloudflare_api_token }}

    - name: Configure R2 public bucket lifecycle
      working-directory: packages/dash
      shell: bash
      run: pnpm exec wrangler r2 bucket lifecycle set public --file ../../infra/r2/public-bucket-lifecycle.json --force
      env:
        CLOUDFLARE_ACCOUNT_ID: ${{ inputs.cloudflare_account_id }}
        CLOUDFLARE_API_TOKEN: ${{ inputs.cloudflare_api_token }}
